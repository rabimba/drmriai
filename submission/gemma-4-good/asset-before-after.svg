<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Before and after — the haystack and the evidence</title>
  <desc id="d">A visual comparison showing the naive "send everything" approach with 200+ slices versus the Dr.MRI.AI evidence-first approach with 16 selected slices.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f7ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4285f4"/>
      <stop offset="0.34" stop-color="#ea4335"/>
      <stop offset="0.66" stop-color="#fbbc04"/>
      <stop offset="1" stop-color="#34a853"/>
    </linearGradient>
    <linearGradient id="brain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f0fe"/>
      <stop offset="0.5" stop-color="#8ab4f8"/>
      <stop offset="1" stop-color="#1a73e8"/>
    </linearGradient>
    <linearGradient id="brainOff" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f3f4"/>
      <stop offset="1" stop-color="#9aa0a6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#174ea6" flood-opacity="0.10"/>
    </filter>
    <pattern id="thumbpattern" patternUnits="userSpaceOnUse" width="44" height="44">
      <rect width="40" height="40" rx="6" fill="#0b1320"/>
      <circle cx="20" cy="20" r="11" fill="url(#brainOff)" opacity="0.85"/>
      <path d="M11 20 H29 M20 11 V29" stroke="#fff" stroke-opacity="0.35" stroke-width="0.7"/>
    </pattern>
    <clipPath id="leftPanelClip">
      <rect x="80" y="230" width="680" height="540" rx="22"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- header -->
  <g transform="translate(80 64)">
    <g transform="translate(0 -42)">
      <rect width="64" height="6" rx="3" fill="#4285f4"/>
      <rect x="76" width="64" height="6" rx="3" fill="#ea4335"/>
      <rect x="152" width="64" height="6" rx="3" fill="#fbbc04"/>
      <rect x="228" width="64" height="6" rx="3" fill="#34a853"/>
    </g>
    <text x="0" y="0" fill="#4285f4" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="3">EVIDENCE SELECTION · BEFORE / AFTER</text>
    <text x="0" y="62" fill="#202124" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="900">The haystack, and the actual evidence.</text>
    <rect x="0" y="90" width="340" height="4" rx="2" fill="url(#accent)"/>
  </g>

  <!-- divider -->
  <line x1="800" y1="220" x2="800" y2="800" stroke="#d2e3fc" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- =========== LEFT: BEFORE PANEL (with clip so footer bar is clean) =========== -->
  <g filter="url(#soft)">
    <rect x="80" y="230" width="680" height="540" rx="22" fill="#ffffff" stroke="#fad2cf"/>
  </g>
  <g clip-path="url(#leftPanelClip)">
    <!-- top header strip -->
    <rect x="80" y="230" width="680" height="60" fill="#fce8e6"/>
    <text x="112" y="270" fill="#a50e0e" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="2.5">NAIVE BASELINE</text>
    <text x="740" y="270" fill="#a50e0e" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="2.5" text-anchor="end">EVERY SLICE TO THE MODEL</text>

    <!-- thumb grid (slightly shorter to leave room for footer) -->
    <rect x="120" y="316" width="600" height="376" fill="url(#thumbpattern)"/>

    <!-- bottom stat bar inside panel -->
    <rect x="80" y="700" width="680" height="70" fill="#fce8e6"/>
    <text x="112" y="746" fill="#a50e0e" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="900">200+ slices</text>
    <text x="740" y="746" fill="#a50e0e" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="end">~314k image tokens</text>
  </g>

  <!-- =========== RIGHT: AFTER PANEL =========== -->
  <g filter="url(#soft)">
    <rect x="840" y="230" width="680" height="540" rx="22" fill="#ffffff" stroke="#ceead6"/>
  </g>

  <clipPath id="rightPanelClip">
    <rect x="840" y="230" width="680" height="540" rx="22"/>
  </clipPath>
  <g clip-path="url(#rightPanelClip)">
    <!-- top header strip -->
    <rect x="840" y="230" width="680" height="60" fill="#e6f4ea"/>
    <text x="872" y="270" fill="#188038" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="2.5">DR.MRI.AI · EVIDENCE-FIRST</text>
    <text x="1500" y="270" fill="#188038" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="2.5" text-anchor="end">PLANNED BY GEMMA 4</text>

    <!-- bottom stat bar inside panel -->
    <rect x="840" y="700" width="680" height="70" fill="#e6f4ea"/>
    <text x="872" y="746" fill="#188038" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="900">16 slices</text>
    <text x="1500" y="746" fill="#188038" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="end">~2,240 image tokens · ~99% less</text>
  </g>

  <!-- 16 selected slices (4 x 4), rendered outside the clip so the slice numbers are crisp -->
  <g transform="translate(880 322)">
    <!-- row 1 -->
    <g transform="translate(0 0)"><rect width="140" height="86" rx="12" fill="#0b1320"/><circle cx="70" cy="43" r="28" fill="url(#brain)"/><path d="M42 43 H98 M70 15 V71" stroke="#fff" stroke-opacity="0.7" stroke-width="1.5"/><text x="10" y="78" fill="#aecbfa" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">#13</text></g>
    <g transform="translate(154 0)"><rect width="140" height="86" rx="12" fill="#0b1320"/><circle cx="70" cy="43" r="28" fill="url(#brain)"/><path d="M42 43 H98 M70 15 V71" stroke="#fff" stroke-opacity="0.7" stroke-width="1.5"/><text x="10" y="78" fill="#aecbfa" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">#14</text></g>
    <g transform="translate(308 0)"><rect width="140" height="86" rx="12" fill="#0b1320"/><circle cx="70" cy="43" r="28" fill="url(#brain)"/><path d="M42 43 H98 M70 15 V71" stroke="#fff" stroke-opacity="0.7" stroke-width="1.5"/><text x="10" y="78" fill="#aecbfa" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">#15</text></g>
    <g transform="translate(462 0)"><rect width="140" height="86" rx="12" fill="#0b1320"/><circle cx="70" cy="43" r="28" fill="url(#brain)"/><path d="M42 43 H98 M70 15 V71" stroke="#fff" stroke-opacity="0.7" stroke-width="1.5"/><text x="10" y="78" fill="#aecbfa" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">#16</text></g>
    <!-- row 2 -->
    <g transform="translate(0 96)"><rect width="140" height="86" rx="12" fill="#0b1320"/><circle cx="70" cy="43" r="28" fill="url(#brain)"/><path d="M42 43 H98 M70 15 V71" stroke="#fff" stroke-opacity="0.7" stroke-width="1.5"/><text x="10" y="78" fill="#aecbfa" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">#17</text></g>
    <g transform="translate(154 96)"><rect width="140" height="86" rx="12" fill="#0b1320"/><circle cx="70" cy="43" r="28" fill="url(#brain)"/><path d="M42 43 H98 M70 15 V71" stroke="#fff" stroke-opacity="0.7" stroke-width="1.5"/><text x="10" y="78" fill="#aecbfa" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">#18</text></g>
    <g transform="translate(308 96)"><rect width="140" height="86" rx="12" fill="#0b1320"/><circle cx="70" cy="43" r="28" fill="url(#brain)"/><path d="M42 43 H98 M70 15 V71" stroke="#fff" stroke-opacity="0.7" stroke-width="1.5"/><text x="10" y="78" fill="#aecbfa" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">#19</text></g>
    <g transform="translate(462 96)"><rect width="140" height="86" rx="12" fill="#0b1320"/><circle cx="70" cy="43" r="28" fill="url(#brain)"/><path d="M42 43 H98 M70 15 V71" stroke="#fff" stroke-opacity="0.7" stroke-width="1.5"/><text x="10" y="78" fill="#aecbfa" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">#20</text></g>
    <!-- row 3 -->
    <g transform="translate(0 192)"><rect width="140" height="86" rx="12" fill="#0b1320"/><circle cx="70" cy="43" r="28" fill="url(#brain)"/><path d="M42 43 H98 M70 15 V71" stroke="#fff" stroke-opacity="0.7" stroke-width="1.5"/><text x="10" y="78" fill="#aecbfa" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">#21</text></g>
    <g transform="translate(154 192)"><rect width="140" height="86" rx="12" fill="#0b1320"/><circle cx="70" cy="43" r="28" fill="url(#brain)"/><path d="M42 43 H98 M70 15 V71" stroke="#fff" stroke-opacity="0.7" stroke-width="1.5"/><text x="10" y="78" fill="#aecbfa" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">#22</text></g>
    <g transform="translate(308 192)"><rect width="140" height="86" rx="12" fill="#0b1320"/><circle cx="70" cy="43" r="28" fill="url(#brain)"/><path d="M42 43 H98 M70 15 V71" stroke="#fff" stroke-opacity="0.7" stroke-width="1.5"/><text x="10" y="78" fill="#aecbfa" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">#23</text></g>
    <g transform="translate(462 192)"><rect width="140" height="86" rx="12" fill="#0b1320"/><circle cx="70" cy="43" r="28" fill="url(#brain)"/><path d="M42 43 H98 M70 15 V71" stroke="#fff" stroke-opacity="0.7" stroke-width="1.5"/><text x="10" y="78" fill="#aecbfa" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">#24</text></g>
    <!-- row 4 -->
    <g transform="translate(0 288)"><rect width="140" height="86" rx="12" fill="#0b1320"/><circle cx="70" cy="43" r="28" fill="url(#brain)"/><path d="M42 43 H98 M70 15 V71" stroke="#fff" stroke-opacity="0.7" stroke-width="1.5"/><text x="10" y="78" fill="#aecbfa" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">#25</text></g>
    <g transform="translate(154 288)"><rect width="140" height="86" rx="12" fill="#0b1320"/><circle cx="70" cy="43" r="28" fill="url(#brain)"/><path d="M42 43 H98 M70 15 V71" stroke="#fff" stroke-opacity="0.7" stroke-width="1.5"/><text x="10" y="78" fill="#aecbfa" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">#26</text></g>
    <g transform="translate(308 288)"><rect width="140" height="86" rx="12" fill="#0b1320"/><circle cx="70" cy="43" r="28" fill="url(#brain)"/><path d="M42 43 H98 M70 15 V71" stroke="#fff" stroke-opacity="0.7" stroke-width="1.5"/><text x="10" y="78" fill="#aecbfa" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">#27</text></g>
    <g transform="translate(462 288)"><rect width="140" height="86" rx="12" fill="#0b1320"/><circle cx="70" cy="43" r="28" fill="url(#brain)"/><path d="M42 43 H98 M70 15 V71" stroke="#fff" stroke-opacity="0.7" stroke-width="1.5"/><text x="10" y="78" fill="#aecbfa" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">#28</text></g>
  </g>

  <text x="80" y="850" fill="#5f6368" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500">Tokens estimated at ~1,600 / image baseline vs. ~140 / image in Dr.MRI.AI's WebGPU pipeline.</text>
</svg>
