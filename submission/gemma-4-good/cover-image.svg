      <rect x="25" y="28" width="128" height="86" rx="10" fill="#e8f0fe"/>
      <rect x="175" y="28" width="128" height="86" rx="10" fill="#fce8e6"/>
      <rect x="325" y="28" width="128" height="86" rx="10" fill="#fef7e0"/>
