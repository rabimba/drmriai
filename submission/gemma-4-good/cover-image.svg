    <text x="28" y="45" fill="#202124" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Gemma 4 E2B-it ONNX</text>
    <rect x="400" y="0" width="260" height="72" rx="18" fill="#ffffff" stroke="#ceead6"/>
    <rect x="400" y="0" width="10" height="72" rx="5" fill="#34a853"/>
    <text x="428" y="45" fill="#202124" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">WebGPU</text>
    <rect x="690" y="0" width="330" height="72" rx="18" fill="#ffffff" stroke="#fce8b2"/>
    <rect x="690" y="0" width="10" height="72" rx="5" fill="#fbbc04"/>
    <text x="718" y="45" fill="#202124" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">MedGemma option</text>
