      <rect x="98" y="0" width="86" height="8" rx="4" fill="#ea4335"/>
      <rect x="196" y="0" width="86" height="8" rx="4" fill="#fbbc04"/>
      <rect x="294" y="0" width="86" height="8" rx="4" fill="#34a853"/>
