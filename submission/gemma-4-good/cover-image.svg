    <text x="0" y="98" fill="#202124" font-family="Inter, Arial, sans-serif" font-size="88" font-weight="800">Dr.MRI.AI</text>
    <text x="0" y="156" fill="#3c4043" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="500">Evidence-first review with Gemma 4</text>
