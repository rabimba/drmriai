  <circle cx="1405" cy="385" r="150" fill="#e6f4ea" opacity="0.95"/>
  <circle cx="236" cy="720" r="145" fill="#fef7e0" opacity="0.92"/>
  <path d="M0 724 C210 642 380 690 560 604 C780 502 1000 584 1210 498 C1390 425 1510 449 1600 404 L1600 900 L0 900 Z" fill="#e8f0fe" opacity="0.84"/>
  <path d="M0 790 C245 704 440 742 635 650 C835 558 1030 638 1245 548 C1410 478 1535 500 1600 465 L1600 900 L0 900 Z" fill="#e6f4ea" opacity="0.9"/>

