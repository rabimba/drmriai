<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dr.MRI.AI Gemma 4 Good Hackathon Cover</title>
  <desc id="desc">Google-color inspired Gemma 4 Good cover showing a DICOM viewer, Gemma 4 Browser, and privacy-first slice triage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#f3f7ff"/>
      <stop offset="1" stop-color="#eef7f1"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f0fe"/>
      <stop offset="0.46" stop-color="#8ab4f8"/>
      <stop offset="1" stop-color="#185abc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
